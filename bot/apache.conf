# Bot API: /api/games and /api/games/* go to the Node referee; api/*.php stays with PHP.
ProxyPassMatch "^/api/games(/.*)?$" "http://bot:3000/api/games$1" timeout=60
ProxyPassReverse "/api/games" "http://bot:3000/api/games"
# MCP (Streamable HTTP); 404 unless MCP_TOKEN is set on the bot service.
ProxyPass "/mcp" "http://bot:3000/mcp" timeout=60
ProxyPassReverse "/mcp" "http://bot:3000/mcp"

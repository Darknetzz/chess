services:
  chess:
    build: .
    image: chess:latest
    container_name: chess
    ports:
      - "${CHESS_PORT:-8080}:80"
    environment:
      REGISTRATION_OPEN: "${CHESS_REGISTRATION_OPEN:-true}"
    volumes:
      - chess-data:/data
    labels:
      # locally built image: nothing for watchtower to pull
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped

volumes:
  chess-data:

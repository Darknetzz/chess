services:
  chess:
    # Published images (GitLab CI): latest = newest release, edge = newest dev commit. CHESS_IMAGE_TAG in .env.
    image: darknetz/chess:${CHESS_IMAGE_TAG:-latest}
    container_name: chess
    ports:
      - "${CHESS_PORT:-8080}:80"
    environment:
      REGISTRATION_OPEN: "${CHESS_REGISTRATION_OPEN:-true}"
    volumes:
      - chess-data:/data
    depends_on:
      - bot
    restart: unless-stopped

  bot:
    image: darknetz/chess-bot:${CHESS_IMAGE_TAG:-latest}
    container_name: chess-bot
    environment:
      BOT_MOVE_TIME_MS: "${CHESS_BOT_MOVE_TIME_MS:-30000}"
      BOT_CREATE_PER_HOUR: "${CHESS_BOT_CREATE_PER_HOUR:-30}"
      # proxies that append to X-Forwarded-For in front of the bot (Apache = 1; +1 per extra reverse proxy)
      BOT_PROXY_HOPS: "${CHESS_BOT_PROXY_HOPS:-1}"
      # server-side Stockfish (headless games only): parallel engine processes, depth and time caps
      BOT_ENGINE_MAX_PROCS: "${CHESS_BOT_ENGINE_MAX_PROCS:-2}"
      BOT_ENGINE_MAX_DEPTH: "${CHESS_BOT_ENGINE_MAX_DEPTH:-30}"
      BOT_ENGINE_MAX_MS: "${CHESS_BOT_ENGINE_MAX_MS:-2000}"
      # MCP over HTTP at /mcp: bearer token (empty = /mcp disabled) and browser origins allowed to call it
      MCP_TOKEN: "${CHESS_MCP_TOKEN:-}"
      MCP_ALLOWED_ORIGINS: "${CHESS_MCP_ALLOWED_ORIGINS:-}"
      # MCP library tools (the user's saved games in the web app): default API key, and where the web app is reached
      MCP_LIBRARY_KEY: "${CHESS_MCP_LIBRARY_KEY:-}"
      LIBRARY_API_URL: "${CHESS_LIBRARY_API_URL:-http://chess}"
    volumes:
      - bot-data:/data
    restart: unless-stopped

volumes:
  chess-data:
  bot-data:

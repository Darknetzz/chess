# Multi-arch (amd64 + arm64) images for the web app (Dockerfile) and the bot service (bot/Dockerfile),
# pushed to Docker Hub (darknetz/chess, darknetz/chess-bot) and GHCR (ghcr.io/darknetzz/chess, -bot):
#   push to dev      -> edge, build-N (N from version.json)
#   tag vX.Y.Z       -> X.Y.Z, X.Y, X, latest; plus a GitLab release from CHANGELOG.md
#
# CI/CD variables (Settings -> CI/CD -> Variables; tokens masked + protected, so dev and v* tags are protected):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN   Docker Hub access token (read/write)
#   GHCR_USERNAME, GHCR_TOKEN             GitHub classic PAT with write:packages
# Missing credentials for a registry skip that registry; with none set the docker job does not run.
# The runner must allow privileged containers (docker:dind + binfmt for arm64).

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
    - if: $CI_COMMIT_BRANCH

stages: [test, publish, release]

lint-php:
  stage: test
  image: php:8.5.12-cli-alpine
  script:
    - for f in api/*.php; do php -l "$f"; done

lint-node:
  stage: test
  image: node:26.13.1-alpine
  script:
    - for f in bot/*.mjs; do node --check "$f"; done

docker:
  stage: publish
  image: docker:29.10.0
  services:
    - name: docker:29.10.0-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    SOURCE_URL: https://github.com/Darknetzz/chess
  parallel:
    matrix:
      - NAME: [chess, chess-bot]
  rules:
    - if: ($CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "dev") && ($DOCKERHUB_TOKEN || $GHCR_TOKEN)
  script:
    - until docker info >/dev/null 2>&1; do sleep 1; done
    - |
      set -eu
      case "$NAME" in
        chess) DOCKERFILE=Dockerfile; DESCRIPTION="Browser chess vs friends, Stockfish or bots (PHP web app)";;
        chess-bot) DOCKERFILE=bot/Dockerfile; DESCRIPTION="Chess game referee: bot API and MCP server (Node)";;
      esac
      BUILD=$(sed -E 's/.*"build":([0-9]+).*/\1/' version.json)
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        V="${CI_COMMIT_TAG#v}"; VERSION_TAGS="$V ${V%.*} ${V%%.*} latest"
      else
        V="build-$BUILD"; VERSION_TAGS="edge build-$BUILD"
      fi
      TAGS=""
      if [ -n "${DOCKERHUB_TOKEN:-}" ]; then
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
        for t in $VERSION_TAGS; do TAGS="$TAGS -t darknetz/$NAME:$t"; done
      else echo "DOCKERHUB_TOKEN unset: skipping Docker Hub"; fi
      if [ -n "${GHCR_TOKEN:-}" ]; then
        echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
        for t in $VERSION_TAGS; do TAGS="$TAGS -t ghcr.io/darknetzz/$NAME:$t"; done
      else echo "GHCR_TOKEN unset: skipping GHCR"; fi
      [ -n "$TAGS" ] || { echo "No registry credentials set"; exit 1; }
      docker run --privileged --rm tonistiigi/binfmt --install arm64
      docker context create ci
      docker buildx create --use --name multi ci
      docker buildx build --platform linux/amd64,linux/arm64 -f "$DOCKERFILE" \
        --label org.opencontainers.image.version="$V" \
        --label org.opencontainers.image.revision="$CI_COMMIT_SHA" \
        --label org.opencontainers.image.source="$SOURCE_URL" \
        --annotation "index:org.opencontainers.image.source=$SOURCE_URL" \
        --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
        $TAGS --push .
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - awk -v t="$CI_COMMIT_TAG" '/^## \[/ { p = index($0, "## [" t "]") == 1; next } p' CHANGELOG.md > notes.md
    - test -s notes.md || { echo "CHANGELOG.md has no '## [$CI_COMMIT_TAG]' section"; exit 1; }
    - cat notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./notes.md

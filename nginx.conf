# Reference server block for nginx + php-fpm (PHP 8.5 with pdo_sqlite).
# The Docker image uses php:apache instead; this is for hosting on an existing nginx.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's stock mime.types already maps .wasm -> application/wasm (needed by Stockfish).
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # Keep the SQLite DB out of reach (better: set DATA_DIR outside the docroot).
    location ^~ /data/ { return 404; }
    location = /api/_lib.php { return 404; }

    location ~ ^/api/[a-z_]+\.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DATA_DIR /var/lib/chess;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    # Bot API (Node referee, bot/server.mjs). Long-poll needs > 30 s read timeout.
    location ~ ^/api/games(/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(wasm|svg|css|js)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
